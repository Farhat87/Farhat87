<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="880" height="160" role="img" aria-label="Rocket flying through space">
  <title>Always crafting, always building</title>
  <defs>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2ea043" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f85149" stop-opacity="0"/>
      <stop offset="55%" stop-color="#f0883e"/>
      <stop offset="100%" stop-color="#ffd33d"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: #0d1117; }
    .star { fill: #8b949e; animation: tw 3.2s ease-in-out infinite; }
    .star.g { fill: #2ea043; }
    .d1 { animation-delay: .4s }  .d2 { animation-delay: .8s }
    .d3 { animation-delay: 1.2s } .d4 { animation-delay: 1.6s }
    .d5 { animation-delay: 2.0s } .d6 { animation-delay: 2.6s }
    @keyframes tw { 0%, 100% { opacity: .2 } 50% { opacity: 1 } }

    .ship { animation: fly 7s linear infinite; }
    @keyframes fly {
      from { transform: translate(-130px, 0) }
      to   { transform: translate(1010px, 0) }
    }

    .f1 { animation: flick 260ms steps(2, end) infinite; }
    .f2 { animation: flick2 260ms steps(2, end) infinite; }
    @keyframes flick  { 0% { opacity: 1 }  50% { opacity: .45 } }
    @keyframes flick2 { 0% { opacity: .5 } 50% { opacity: 1 } }

    .trail { animation: pulse 700ms ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .75 } 50% { opacity: .35 } }
  </style>

  <rect class="bg" width="880" height="160" rx="12"/>

  <!-- starfield -->
  <g>
    <circle class="star"       cx="38"  cy="28"  r="1.6"/>
    <circle class="star d3"    cx="96"  cy="112" r="1.2"/>
    <circle class="star d1"    cx="140" cy="52"  r="1.9"/>
    <circle class="star g d5"  cx="188" cy="134" r="1.5"/>
    <circle class="star d2"    cx="214" cy="22"  r="1.3"/>
    <circle class="star d6"    cx="262" cy="88"  r="1.7"/>
    <circle class="star d4"    cx="308" cy="42"  r="1.2"/>
    <circle class="star g d2"  cx="352" cy="124" r="1.8"/>
    <circle class="star d5"    cx="392" cy="66"  r="1.4"/>
    <circle class="star d1"    cx="436" cy="18"  r="1.6"/>
    <circle class="star d3"    cx="478" cy="142" r="1.3"/>
    <circle class="star g d6"  cx="524" cy="74"  r="1.7"/>
    <circle class="star d2"    cx="566" cy="34"  r="1.5"/>
    <circle class="star d4"    cx="612" cy="118" r="1.2"/>
    <circle class="star d1"    cx="658" cy="58"  r="1.8"/>
    <circle class="star g d3"  cx="702" cy="26"  r="1.4"/>
    <circle class="star d5"    cx="744" cy="136" r="1.6"/>
    <circle class="star d2"    cx="790" cy="80"  r="1.3"/>
    <circle class="star d6"    cx="836" cy="44"  r="1.7"/>
    <circle class="star d4"    cx="862" cy="122" r="1.2"/>
    <circle class="star d3"    cx="68"  cy="78"  r="1.1"/>
    <circle class="star d5"    cx="248" cy="58"  r="1.1"/>
    <circle class="star d1"    cx="466" cy="96"  r="1.1"/>
    <circle class="star d6"    cx="686" cy="104" r="1.1"/>
    <circle class="star d2"    cx="812" cy="16"  r="1.1"/>
  </g>

  <!-- rocket -->
  <g class="ship" transform="translate(-130,0)">
    <g transform="translate(0,80)">
      <rect class="trail" x="-158" y="-2.5" width="120" height="5" rx="2.5" fill="url(#trail)"/>

      <path class="f1" d="M -34 -8.5 Q -78 0 -34 8.5 Z" fill="url(#flame)"/>
      <path class="f2" d="M -34 -4.5 Q -58 0 -34 4.5 Z" fill="#ffd33d"/>

      <path d="M -18 -11 L -33 -28 L -2 -12 Z" fill="#2ea043"/>
      <path d="M -18  11 L -33  28 L -2  12 Z" fill="#2ea043"/>

      <ellipse cx="0" cy="0" rx="34" ry="12" fill="#e6edf3"/>
      <rect x="-30" y="-4" width="13" height="8" rx="2" fill="#2ea043" opacity=".5"/>
      <path d="M 28 -12 L 58 0 L 28 12 Z" fill="#2ea043"/>
      <circle cx="8" cy="0" r="6.5" fill="#0d1117" stroke="#58a6ff" stroke-width="2.5"/>
    </g>
  </g>
</svg>
